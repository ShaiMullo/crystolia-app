apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: {{ .Values.backend.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /api/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            # Scheduler runs on exactly one pod. With >1 replica, set
            # backend.env.ENABLE_SCHEDULER="false" on the chart and run a
            # single dedicated scheduler replica, OR leave default until
            # leader-election lands (see docs/deployment/README.md).
            - name: ENABLE_SCHEDULER
              value: "{{ .Values.backend.env.ENABLE_SCHEDULER | default "true" }}"
            # Core
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: crystolia-backend-secret
                  key: MONGO_URI
            - name: FRONTEND_URL
              value: "{{ .Values.backend.env.FRONTEND_URL }}"
            - name: CORS_ALLOW_ORIGINS
              value: "{{ .Values.backend.env.CORS_ALLOW_ORIGINS }}"
            {{- if .Values.backend.env.COOKIE_DOMAIN }}
            - name: COOKIE_DOMAIN
              value: "{{ .Values.backend.env.COOKIE_DOMAIN }}"
            {{- end }}
            {{- if .Values.backend.env.GOOGLE_CALLBACK_URL }}
            - name: GOOGLE_CALLBACK_URL
              value: "{{ .Values.backend.env.GOOGLE_CALLBACK_URL }}"
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crystolia-backend-secret
                  key: JWT_SECRET
            # Google OAuth (from secret)
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: crystolia-backend-secret
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crystolia-backend-secret
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            # Green Invoice
            - name: GREEN_INVOICE_API_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GREEN_INVOICE_API_ID
            - name: GREEN_INVOICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GREEN_INVOICE_SECRET
            - name: GREEN_INVOICE_SANDBOX
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GREEN_INVOICE_SANDBOX
            # WhatsApp (UltraMsg provider) — managed via ExternalSecret crystolia-whatsapp-secret
            - name: ULTRAMSG_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: crystolia-whatsapp-secret
                  key: ULTRAMSG_INSTANCE_ID
                  optional: true
            - name: ULTRAMSG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crystolia-whatsapp-secret
                  key: ULTRAMSG_TOKEN
                  optional: true
            - name: ADMIN_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: crystolia-whatsapp-secret
                  key: ADMIN_PHONE_NUMBER
                  optional: true
            # Twilio
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: TWILIO_PHONE_NUMBER
            # Payment
            - name: PAYMENT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: PAYMENT_PROVIDER

