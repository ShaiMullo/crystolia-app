apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend-admin
  labels:
    app: frontend-admin
spec:
  replicas: {{ .Values.frontendAdmin.replicaCount }}
  revisionHistoryLimit: {{ .Values.frontendAdmin.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      app: frontend-admin
  template:
    metadata:
      labels:
        app: frontend-admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend-admin
          image: "{{ .Values.frontendAdmin.image.repository }}:{{ .Values.frontendAdmin.image.tag }}"
          imagePullPolicy: {{ .Values.frontendAdmin.image.pullPolicy }}
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
{{ toYaml .Values.frontendAdmin.resources | indent 12 }}
          env:
            {{- range $key, $value := .Values.frontendAdmin.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crystolia-backend-secret
                  key: JWT_SECRET
