name: Backend Lock File Verification

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  verify-lock-file:
    name: 🔒 Verify package-lock.json
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Verify Lock File Sync (npm ci)
        run: |
          echo "🔧 Running npm ci to verify package-lock.json is in sync with package.json..."
          npm ci
          echo "✅ Lock file is valid and in sync."
