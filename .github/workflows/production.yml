# =============================================================================
# Production CI/CD Pipeline
# =============================================================================
# Builds and pushes Docker images to ECR on version tags.
#
# Authentication: GitHub OIDC → AWS IAM Role (no static credentials)
# Trigger: Version tags (v*)
#
# SECURITY:
# - Uses OIDC for AWS authentication
# - Role restricted to ECR push only
# - No secrets in repository

name: Production Build & Push

on:
  push:
    tags:
      - "v*"
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: sha)"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 268456953512.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-push:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determine image tag
      - name: Set Image Tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Tag push: use tag name (e.g., v1.0.0)
            echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            # Manual with custom tag
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Default to short SHA
            echo "IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      # AWS Authentication via OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268456953512:role/github-actions-ecr-push-role
          role-session-name: github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      # ECR Login
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      # Set up Docker Buildx for caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-backend:${{ steps.set-tag.outputs.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-client
          file: ./frontend-client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:${{ steps.set-tag.outputs.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.crystolia.com

      # Build and Push Frontend Admin
      - name: Build & Push Frontend Admin
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:${{ steps.set-tag.outputs.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://admin.crystolia.com/api

      # Summary
      - name: Print Summary
        run: |
          echo "### 🎉 Images Pushed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| crystolia-backend | \`${{ steps.set-tag.outputs.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| crystolia-frontend | \`${{ steps.set-tag.outputs.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| crystolia-frontend-admin | \`${{ steps.set-tag.outputs.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
