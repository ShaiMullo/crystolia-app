name: Staging Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend-client/**"
      - "frontend-admin/**"
      - "helm/**"
      - ".github/workflows/staging.yml"

# One staging deploy at a time — never race two pushes to the GitOps repo.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 268456953512.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  GITOPS_REPO: ShaiMullo/crystolia-gitops

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'helm/**'
              - '.github/workflows/staging.yml'
            frontend:
              - 'frontend-client/**'
              - 'frontend-admin/**'
              - '.github/workflows/staging.yml'
            admin:
              - 'frontend-admin/**'
            client:
              - 'frontend-client/**'

  # ── Quality gate — images are NEVER built unless these pass ──────────────────
  verify-backend:
    name: 🧪 Verify Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      # Advisory — pre-Phase-9 lint debt; typecheck is the hard gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  verify-admin:
    name: 🧪 Verify Frontend Admin
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  verify-client:
    name: 🧪 Verify Frontend Client
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  build-backend:
    name: 🏗️ Build & Push Backend
    needs: [changes, verify-backend]
    if: ${{ needs.changes.outputs.backend == 'true' && needs.verify-backend.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Safety
        run: git config --global --add safe.directory "*"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268456953512:role/github-actions-ecr-push-role
          role-session-name: github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-backend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: 🏗️ Build & Push Frontend
    needs: [changes, verify-admin, verify-client]
    # Build when the frontend changed AND no verify job failed.
    # (verify-* jobs are skipped when their area is untouched — skipped ≠ failure.)
    # `!cancelled()` is required: without a status-check function in the `if`,
    # GitHub adds an implicit success() over ALL needs, so a *skipped* sibling
    # verify job (e.g. verify-client on an admin-only change) would skip this
    # build too. `!cancelled()` lifts that implicit gate while our explicit
    # `result != 'failure'` checks still block builds on a real verify failure.
    if: >-
      ${{ !cancelled()
          && needs.changes.outputs.frontend == 'true'
          && needs.verify-admin.result != 'failure'
          && needs.verify-client.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Safety
        run: git config --global --add safe.directory "*"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268456953512:role/github-actions-ecr-push-role
          role-session-name: github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Client
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-client
          file: ./frontend-client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Admin
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: 🚀 Update GitOps
    needs: [build-backend, build-frontend]
    if: ${{ always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: crystolia-gitops

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update image tags in staging values
        working-directory: gitops
        run: |
          SHA="${{ env.IMAGE_TAG }}"

          if [ "${{ needs.build-backend.result }}" == "success" ]; then
            echo "📦 Updating backend image tag to ${SHA}"
            sed -i '/^backend:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
          fi

          if [ "${{ needs.build-frontend.result }}" == "success" ]; then
            echo "📦 Updating frontend image tag to ${SHA}"
            sed -i '/^frontend:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
            echo "📦 Updating frontend-admin image tag to ${SHA}"
            sed -i '/^frontendAdmin:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
          fi

          echo "--- Updated values.yaml tags ---"
          grep -A 3 "tag:" staging/values.yaml || true

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/values.yaml
          git diff --cached --quiet && echo "No tag changes to commit" && exit 0
          git commit -m "ci: update staging images to ${{ env.IMAGE_TAG }}"
          git push
