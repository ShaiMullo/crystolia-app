name: Staging Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend-client/**"
      - "frontend-admin/**"
      - "helm/**"
      - ".github/workflows/staging.yml"

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 268456953512.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  GITOPS_REPO: ShaiMullo/crystolia-gitops

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'helm/**'
              - '.github/workflows/staging.yml'
            frontend:
              - 'frontend-client/**'
              - 'frontend-admin/**'
              - '.github/workflows/staging.yml'

  test-frontend:
    name: 🧪 Test Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: frontend-client
      - run: npm run lint || echo "Lint failed but proceeding"
        continue-on-error: true
        working-directory: frontend-client

  build-push:
    name: 🏗️ Build & Push Images
    needs: [changes, test-frontend]
    if: ${{ always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      backend_updated: ${{ steps.build-backend.outcome == 'success' }}
      frontend_updated: ${{ steps.build-frontend.outcome == 'success' }}
      frontend_admin_updated: ${{ steps.build-frontend-admin.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Safety
        run: git config --global --add safe.directory "*"

      # OIDC Authentication (no static credentials)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268456953512:role/github-actions-ecr-push-role
          role-session-name: github-actions-staging
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        id: build-backend
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-backend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Client
        id: build-frontend
        if: ${{ needs.changes.outputs.frontend == 'true' && needs.test-frontend.result == 'success' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-client
          file: ./frontend-client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Admin
        id: build-frontend-admin
        if: ${{ needs.changes.outputs.frontend == 'true' && needs.test-frontend.result == 'success' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/crystolia-frontend-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: 🚀 Update GitOps
    needs: [build-push]
    if: ${{ always() && needs.build-push.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Generate a short-lived token from the GitHub App
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: crystolia-gitops

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update image tags in staging values
        working-directory: gitops
        run: |
          SHA="${{ env.IMAGE_TAG }}"

          # Update backend tag if backend was built
          if [ "${{ needs.build-push.outputs.backend_updated }}" == "true" ]; then
            echo "📦 Updating backend image tag to ${SHA}"
            sed -i '/^backend:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
          fi

          # Update frontend tag if frontend was built
          if [ "${{ needs.build-push.outputs.frontend_updated }}" == "true" ]; then
            echo "📦 Updating frontend image tag to ${SHA}"
            sed -i '/^frontend:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
          fi

          # Update frontend-admin tag if it was built
          if [ "${{ needs.build-push.outputs.frontend_admin_updated }}" == "true" ]; then
            echo "📦 Updating frontend-admin image tag to ${SHA}"
            sed -i '/^frontendAdmin:/,/^[a-zA-Z]/ s/^\(\s*tag:\s*\).*/\1"'"${SHA}"'"/' staging/values.yaml
          fi

          echo "--- Updated values.yaml tags ---"
          grep -A 3 "tag:" staging/values.yaml || true

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/values.yaml
          git diff --cached --quiet && echo "No tag changes to commit" && exit 0
          git commit -m "ci: update staging images to ${{ env.IMAGE_TAG }}"
          git push
